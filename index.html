<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BEYZA</title>
<style>
:root{--gold:#e7b66d;--panel:rgba(10,7,14,.86);--border:rgba(255,255,255,.16)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050309;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:relative;width:min(100vw,430px);height:100dvh;min-height:650px;margin:auto;overflow:hidden;background:#000}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 50%,rgba(0,0,0,.72) 100%);pointer-events:none}
.hot{position:absolute;border:0;background:transparent;opacity:0;z-index:8}
#startHot{left:20%;top:59%;width:60%;height:9%;border-radius:40px}
.top{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;text-shadow:0 2px 10px #000}
.top small{display:block;opacity:.78;letter-spacing:.08em}.top b{font-size:12px}.count{font-size:11px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--border)}
.caption{position:absolute;z-index:6;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));padding:14px 15px;border-radius:18px;background:rgba(0,0,0,.62);border:1px solid var(--border);backdrop-filter:blur(10px);line-height:1.45;font-size:14px}
.choice{position:absolute;z-index:10;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:17px;border-radius:22px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.45)}
.choice h2{font-size:18px;line-height:1.35;margin:0 0 13px}.btns{display:grid;gap:10px}
.btn{border:1px solid var(--border);border-radius:15px;min-height:52px;padding:11px 13px;font:inherit;font-weight:750}
.primary{background:linear-gradient(135deg,#f1d59e,#c98c4d);color:#26180d}.secondary{background:rgba(255,255,255,.08);color:#fff}
.hidden{display:none!important}.end h2{font-family:Georgia,serif}.end p{opacity:.82;line-height:1.5;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen active">
    <img id="menuImg" class="bg" alt="BEYZA">
    <button id="startHot" class="hot" aria-label="Yeni Oyun"></button>
  </section>
  <section id="story" class="screen">
    <img id="scene" class="bg" alt="">
    <div class="shade"></div>
    <div class="top"><div><small>BÖLÜM 1 · 12 EYLÜL 2026</small><b>JW Marriott Ankara · Arem Arman</b></div><div id="count" class="count">1 / 20</div></div>
    <div id="caption" class="caption"></div>
    <div id="choice" class="choice hidden"><h2 id="q"></h2><div id="btns" class="btns"></div></div>
    <div id="end" class="choice end hidden"><h2 id="endTitle"></h2><p id="endText"></p><div class="btns"><button id="restart" class="btn primary">Baştan Oyna</button></div></div>
  </section>
</div>
<script src="assets/00.js"></script>
<script src="assets/01.js"></script>
<script src="assets/02.js"></script>
<script src="assets/03.js"></script>
<script src="assets/04.js"></script>
<script src="assets/05_06.js"></script>
<script>
(()=>{
const A=window.__BEYZA_ASSETS__||[];
const menu=document.getElementById('menu'),story=document.getElementById('story'),menuImg=document.getElementById('menuImg'),scene=document.getElementById('scene'),caption=document.getElementById('caption'),choice=document.getElementById('choice'),q=document.getElementById('q'),btns=document.getElementById('btns'),count=document.getElementById('count'),end=document.getElementById('end'),endTitle=document.getElementById('endTitle'),endText=document.getElementById('endText');
menuImg.src=A[0]||A[1]||''; scene.src=A[1]||A[0]||'';
let timers=[];
const clear=()=>{timers.forEach(clearTimeout);timers=[]};
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t)};
const img=i=>A[i]||A[1]||A[0]||'';
function setScene(i,text,n){scene.style.opacity=0;later(()=>{scene.src=img(i);scene.style.opacity=1;caption.textContent=text;caption.classList.remove('hidden');count.textContent=n+' / 20'},160)}
function ask(text,opts){clear();caption.classList.add('hidden');choice.classList.remove('hidden');q.textContent=text;btns.innerHTML='';opts.forEach((o,j)=>{const b=document.createElement('button');b.className='btn '+(j===0?'primary':'secondary');b.textContent=o.label;b.onclick=o.go;btns.appendChild(b)})}
function finish(title,text){clear();choice.classList.add('hidden');caption.classList.add('hidden');end.classList.remove('hidden');endTitle.textContent=title;endText.textContent=text}
const p1=[
[2,'Bir anlığına göz göze geliyorsunuz…',2,2700],
[3,'İkiniz de utanıp başka tarafa dönüyorsunuz…',3,2700],
[4,'Beyza tuvalete giderken Eren onu arkadan hayranlıkla izliyor…',4,3000],
[4,'Kalabalığın içinde iki kişi ön taraftaki kızları rahatsız ediyor.',5,3300],
[4,'Eren araya giriyor: “Dağılın burdan.”',6,3300],
[2,'Beyza geri geliyor. Eren’in gözü hâlâ onda.',7,3300],
[2,'Bu kez ikiniz de birbirinize bakıp gülümsüyorsunuz.',8,3300],
[3,'Araya giren kızlara rağmen Eren sadece Beyza’ya bakıyor.',9,3300],
[3,'Beyza üzgünce uzaklaşıyor. Eren onun gidişini izliyor.',10,3600],
[5,'İnsanlar halay çekmeye başlıyor. Eren elini Beyza’ya uzatıyor.',11,2550]
];
const p2=[
[5,'Kalabalık halayın içinde yan yana dans ediyorsunuz. İkiniz de keyifli, sevgi dolu ve utangaçsınız.',13,3600],
[5,'Halay bitiyor. Biraz uzaklaşıp arkadaşlarınızın yanına gidiyorsunuz.',14,3300],
[3,'Beyza kendi kendine: “At şu adımı be adam!”',15,2700],
[2,'Aranıza insanlar giriyor. Eren konserin tadını çıkarırken Beyza ona bakıyor.',16,3300]
];
function play(list,done){clear();choice.classList.add('hidden');let k=0;const next=()=>{if(k>=list.length)return done();const x=list[k++];setScene(x[0],x[1],x[2]);later(next,x[3])};next()}
function firstQuestion(){ask('Yanında bir çocuk var. Sanırım sana bakıyor. Sen de ona bakmak ister misin?',[
{label:'👀 Evet, yandaki çocuğa bak',go:()=>play(p1,halayQuestion)},
{label:'Hayır, boş ver',go:()=>finish('Beyza boş verdi.','Bu alternatif hikâye yolunu daha sonra genişleteceğiz.')}
])}
function halayQuestion(){count.textContent='12 / 20';scene.src=img(5);ask('Eren seni halaya davet ediyor.',[
{label:'Kabul et',go:()=>play(p2,nameQuestion)},
{label:'Etme',go:()=>finish('Beyza daveti kabul etmedi.','Bu alternatif yol daha sonra devam edecek.')}
])}
function nameQuestion(){count.textContent='17 / 20';scene.src=img(2);ask('Şimdi ne yapalım?',[
{label:'Yanına git ve ismini sor',go:introAge},
{label:'Boşver be',go:()=>finish('Beyza geri durdu.','Bu alternatif yol daha sonra devam edecek.')}
])}
function introAge(){choice.classList.add('hidden');setScene(6,'Eren: “Eren, peki sen?”  Beyza: “Ben de Beyza. Peki kaç yaşındasın?”',18);later(ageReveal,3600)}
function ageReveal(){setScene(6,'Eren: “25.”  Beyza yüzünü biraz ekşiterek: “Ben de 28.”',19);later(ageQuestion,3600)}
function ageQuestion(){count.textContent='20 / 20';scene.src=img(6);ask('Bu farkı problem etmeli misin?',[
{label:'Hayır, ben ondan hoşlandım.',go:()=>finish('Beyza yaş farkını problem etmedi.','“Hayır, ben ondan hoşlandım.” yolu seçildi. Hikâye buradan devam edecek.')},
{label:'Olmaz, yaşıt değiliz.',go:()=>finish('Beyza yaş farkını problem etti.','“Olmaz, yaşıt değiliz.” yolu ayrı bir dal olarak devam edecek.')}
])}
function start(){clear();end.classList.add('hidden');choice.classList.add('hidden');menu.classList.remove('active');story.classList.add('active');scene.src=img(1);caption.textContent='Eren ve Beyza yan yana, birbirlerinden habersiz şekilde dans ediyor…';caption.classList.remove('hidden');count.textContent='1 / 20';later(firstQuestion,3300)}
document.getElementById('startHot').onclick=start;
document.getElementById('restart').onclick=()=>{clear();story.classList.remove('active');menu.classList.add('active')};
})();
</script>
</body></html>
