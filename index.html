<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BEYZA · Prototip Güncel</title>
<style>
:root {
  --bg:#07050b;
  --panel:rgba(11,8,16,.88);
  --border:rgba(255,255,255,.14);
  --gold1:#f3d59f;
  --gold2:#ce9154;
}
* { box-sizing:border-box; }
html, body {
  margin:0; padding:0; background:var(--bg); color:#fff;
  font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
body {
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
}
#app {
  position:relative; width:min(100vw,430px); height:100vh; min-height:680px;
  overflow:hidden; background:#000;
}
.view { position:absolute; inset:0; display:none; }
.view.active { display:block; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; image-rendering:auto; -webkit-transform:translateZ(0); transform:translateZ(0); }
.fade { transition:opacity .38s ease; }
.shade {
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.03) 52%, rgba(0,0,0,.74) 100%);
  pointer-events:none;
}
.hotspot {
  position:absolute; z-index:8; border:0; background:transparent; opacity:0;
  border-radius:999px; cursor:pointer; touch-action:manipulation;
}
.hotspot:focus-visible {
  opacity:.12; outline:3px solid rgba(255,234,192,.95); outline-offset:2px;
  background:rgba(255,255,255,.08);
}
#newGame { left:21%; width:58%; top:61.0%; height:5.6%; }
#continueBtn { left:22%; width:56%; top:67.2%; height:5.1%; }
#chaptersBtn { left:22%; width:56%; top:72.8%; height:4.9%; }
#memoriesBtn { left:35%; width:30%; top:78.7%; height:4.0%; }
#acceptHalayHotspot { left:10%; width:40%; top:80.4%; height:8.4%; border-radius:26px; }
#declineHalayHotspot { left:53%; width:38%; top:80.4%; height:8.4%; border-radius:26px; }
#askNameHotspot { left:8%; width:40.5%; top:82.0%; height:9.4%; border-radius:24px; }
#ignoreHotspot { left:51.5%; width:40.5%; top:82.0%; height:9.4%; border-radius:24px; }
#ageOkHotspot { left:7%; width:86%; top:79.0%; height:8.8%; border-radius:24px; }
#ageNoHotspot { left:7%; width:86%; top:89.0%; height:8.0%; border-radius:24px; }

.hint {
  position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:10; padding:8px 12px; border-radius:999px;
  background:rgba(0,0,0,.58); border:1px solid var(--border);
  font-size:11px; opacity:0; transition:opacity .2s ease;
  pointer-events:none; white-space:nowrap;
}
.hint.show { opacity:1; }
.topbar {
  position:absolute; top:max(16px, env(safe-area-inset-top)); left:16px; right:16px;
  z-index:9; display:flex; justify-content:space-between; align-items:flex-start;
  text-shadow:0 2px 14px rgba(0,0,0,.8);
}
.meta small {
  display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:.82;
}
.meta strong { display:block; margin-top:4px; font-size:13px; }
.progress {
  font-size:12px; padding:7px 10px; border-radius:999px;
  background:rgba(0,0,0,.46); border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
}
.caption {
  position:absolute; left:14px; right:14px; bottom:16px; z-index:9;
  padding:13px 15px; border-radius:18px; background:rgba(0,0,0,.58);
  border:1px solid var(--border); font-size:14px; line-height:1.48;
  backdrop-filter:blur(10px);
}
.panel {
  position:absolute; left:14px; right:14px; bottom:max(14px, env(safe-area-inset-bottom));
  z-index:10; padding:16px; border-radius:22px; background:var(--panel);
  border:1px solid var(--border); box-shadow:0 14px 40px rgba(0,0,0,.36);
  backdrop-filter:blur(14px);
}
.panel h2 {
  margin:0 0 14px; font-size:18px; line-height:1.38;
}
.choices { display:grid; gap:10px; }
.btn {
  min-height:52px; border-radius:16px; border:1px solid var(--border);
  font:inherit; font-weight:700; cursor:pointer; padding:11px 14px;
}
.btn.primary {
  background:linear-gradient(135deg,var(--gold1),var(--gold2)); color:#24170d;
}
.btn.secondary {
  background:rgba(255,255,255,.08); color:#fff;
}
.end-title {
  font-family:Georgia, serif; font-size:22px !important; margin-bottom:6px !important;
}
.end-copy {
  margin:0 0 14px; font-size:13px; line-height:1.55; opacity:.84;
}
.hidden { display:none !important; }
@media (prefers-reduced-motion: reduce) {
  .fade { transition:none; }
}
</style>

</head>
<body>
<main id="app">
  <section id="menuView" class="view active" aria-label="Ana menü">
    <img id="menuBg" class="bg" src="" alt="BEYZA giriş ekranı">
    <button id="newGame" class="hotspot" type="button" aria-label="Yeni Oyun"></button>
    <button id="continueBtn" class="hotspot" type="button" aria-label="Devam Et"></button>
    <button id="chaptersBtn" class="hotspot" type="button" aria-label="Bölümler"></button>
    <button id="memoriesBtn" class="hotspot" type="button" aria-label="Anılar"></button>
    <div id="menuHint" class="hint" aria-live="polite"></div>
  </section>

  <section id="storyView" class="view" aria-live="polite">
    <img id="sceneImg" class="bg fade" src="" alt="Konserde Eren ve Beyza">
    <div class="shade"></div>

    <div class="topbar">
      <div class="meta">
        <small>Bölüm 1 · 12 Eylül 2026</small>
        <strong>JW Marriott Ankara · Arem Arman Konseri</strong>
      </div>
      <div id="progressPill" class="progress">1 / 20</div>
    </div>

    <div id="captionBox" class="caption">
      Eren ve Beyza yan yana, birbirlerinden habersiz şekilde dans ediyor…
    </div>

    <div id="firstQuestionPanel" class="panel hidden">
      <h2>Yanında bir çocuk var. Sanırım sana bakıyor. Sen de ona bakmak ister misin?</h2>
      <div class="choices">
        <button id="yesBtn" class="btn primary" type="button">👀 Evet, yandaki çocuğa bak</button>
        <button id="noBtn" class="btn secondary" type="button">Hayır, boş ver</button>
      </div>
    </div>

    <button id="acceptHalayHotspot" class="hotspot hidden" type="button" aria-label="Kabul et"></button>
    <button id="declineHalayHotspot" class="hotspot hidden" type="button" aria-label="Etme"></button>
    <button id="askNameHotspot" class="hotspot hidden" type="button" aria-label="Yanına git ve ismini sor"></button>
    <button id="ignoreHotspot" class="hotspot hidden" type="button" aria-label="Boşver be"></button>
    <button id="ageOkHotspot" class="hotspot hidden" type="button" aria-label="Hayır, ben ondan hoşlandım"></button>
    <button id="ageNoHotspot" class="hotspot hidden" type="button" aria-label="Olmaz, yaşıt değiliz"></button>

    <div id="endingPanel" class="panel hidden">
      <h2 id="endingTitle" class="end-title"></h2>
      <p id="endingCopy" class="end-copy"></p>
      <div class="choices">
        <button id="restartBtn" class="btn primary" type="button">Baştan Oyna</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const IMAGES = {
    "menu":"assets/scenes/menu.webp?v=11",
    "dance":"assets/scenes/dance.webp?v=11",
    "glance":"assets/scenes/glance.webp?v=11",
    "blush":"assets/scenes/blush.webp?v=11",
    "wc_walk":"assets/scenes/wc_walk.webp?v=11",
    "harassment":"assets/scenes/harassment.webp?v=11",
    "push":"assets/scenes/push.webp?v=11",
    "romantic_return":"assets/scenes/romantic_return.webp?v=11",
    "mutual_smile":"assets/scenes/mutual_smile.webp?v=11",
    "jealous":"assets/scenes/jealous.webp?v=11",
    "sad_leave":"assets/scenes/sad_leave.webp?v=11",
    "halay_invite":"assets/scenes/halay_invite.webp?v=11",
    "halay_question":"assets/scenes/halay_question.webp?v=11",
    "halay_together":"assets/scenes/halay_together.webp?v=11",
    "after_halay":"assets/scenes/after_halay.webp?v=11",
    "self_talk":"assets/scenes/self_talk.webp?v=11",
    "apart_people":"assets/scenes/apart_people.webp?v=11",
    "final_question":"assets/scenes/final_question.webp?v=11",
    "intro_name_age":"assets/scenes/intro_name_age.webp?v=11",
    "age_reveal":"assets/scenes/age_reveal.webp?v=11",
    "age_difference_question":"assets/scenes/age_difference_question.webp?v=11"
  };
  const PART1 = [{"key": "glance", "caption": "Bir anlığına göz göze geliyorsunuz…", "duration": 2700}, {"key": "blush", "caption": "İkiniz de utanıp başka tarafa dönüyorsunuz…", "duration": 2700}, {"key": "wc_walk", "caption": "Beyza tuvalete giderken Eren onu arkadan hayranlıkla izliyor…", "duration": 3000}, {"key": "harassment", "caption": "O sırada kalabalığın içinde tatsız bir an yaşanıyor…", "duration": 3300}, {"key": "push", "caption": "Eren araya girip onları uzaklaştırıyor: “dağılın burdan”", "duration": 3300}, {"key": "romantic_return", "caption": "Beyza geri dönüyor ve Eren’in yanında konserin tadını çıkarmaya devam ediyor…", "duration": 3300}, {"key": "mutual_smile", "caption": "Bu kez ikiniz de birbirinize bakıp gülümsüyorsunuz…", "duration": 3300}, {"key": "jealous", "caption": "Araya giren kızlar ortamı bozuyor… ama Eren’in gözü yine sadece Beyza’da.", "duration": 3300}, {"key": "sad_leave", "caption": "Beyza üzgün şekilde uzaklaşıyor… Eren de onun gidişini buruk gözlerle izliyor.", "duration": 3600}, {"key": "halay_invite", "caption": "İnsanlar halay çekmeye başlıyor… Eren, Beyza’ya elini uzatıyor.", "duration": 2550}];
  const PART2 = [{"key": "halay_together", "caption": "Kalabalık halayın içinde yan yana dans ediyorsunuz… ikiniz de mutlu, sevgi dolu ve utangaçsınız.", "duration": 3600}, {"key": "after_halay", "caption": "Halay bitiyor… ikiniz de biraz uzaklaşıp arkadaşlarınızın yanına gidiyorsunuz.", "duration": 3300}, {"key": "self_talk", "caption": "", "duration": 2700}, {"key": "apart_people", "caption": "Aranıza insanlar giriyor… Eren konserin tadını çıkarırken Beyza ona doğru bakıyor.", "duration": 3300}];
  const TOTAL_STEPS = 20;
  const START_DELAY = 3300;
  const FADE_SWAP = 170;

  Object.values(IMAGES).forEach(src => { const i = new Image(); i.src = src; });

  const menuView = document.getElementById('menuView');
  const menuBg = document.getElementById('menuBg');
  const storyView = document.getElementById('storyView');
  const sceneImg = document.getElementById('sceneImg');
  const menuHint = document.getElementById('menuHint');
  const captionBox = document.getElementById('captionBox');
  const firstQuestionPanel = document.getElementById('firstQuestionPanel');
  const endingPanel = document.getElementById('endingPanel');
  const endingTitle = document.getElementById('endingTitle');
  const endingCopy = document.getElementById('endingCopy');
  const progressPill = document.getElementById('progressPill');

  const acceptHalayHotspot = document.getElementById('acceptHalayHotspot');
  const declineHalayHotspot = document.getElementById('declineHalayHotspot');
  const askNameHotspot = document.getElementById('askNameHotspot');
  const ignoreHotspot = document.getElementById('ignoreHotspot');
  const ageOkHotspot = document.getElementById('ageOkHotspot');
  const ageNoHotspot = document.getElementById('ageNoHotspot');

  menuBg.src = IMAGES.menu;
  sceneImg.src = IMAGES.dance;

  let timers = [];

  function later(fn, ms) {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function showHint(text) {
    menuHint.textContent = text;
    menuHint.classList.add('show');
    clearTimeout(menuHint._hideTimer);
    menuHint._hideTimer = setTimeout(() => menuHint.classList.remove('show'), 1500);
  }

  function crossfadeTo(src, alt='') {
    sceneImg.style.opacity = '0';
    later(() => {
      sceneImg.src = src;
      sceneImg.alt = alt;
      sceneImg.style.opacity = '1';
    }, FADE_SWAP);
  }

  function hideAllOverlays() {
    firstQuestionPanel.classList.add('hidden');
    endingPanel.classList.add('hidden');
    acceptHalayHotspot.classList.add('hidden');
    declineHalayHotspot.classList.add('hidden');
    askNameHotspot.classList.add('hidden');
    ignoreHotspot.classList.add('hidden');
    ageOkHotspot.classList.add('hidden');
    ageNoHotspot.classList.add('hidden');
  }

  function updateProgress(step) {
    progressPill.textContent = `${step} / ${TOTAL_STEPS}`;
  }

  function startGame() {
    clearTimers();
    menuView.classList.remove('active');
    storyView.classList.add('active');
    hideAllOverlays();
    sceneImg.src = IMAGES.dance;
    sceneImg.alt = 'Konserde Eren ve Beyza birbirlerine bakmadan dans ediyor';
    sceneImg.style.opacity = '1';
    captionBox.classList.remove('hidden');
    captionBox.textContent = 'Eren ve Beyza yan yana, birbirlerinden habersiz şekilde dans ediyor…';
    updateProgress(1);
    later(() => {
      firstQuestionPanel.classList.remove('hidden');
    }, START_DELAY);
  }

  function runPart1() {
    clearTimers();
    hideAllOverlays();
    captionBox.classList.remove('hidden');
    let idx = 0;
    function nextScene() {
      if (idx >= PART1.length) {
        showHalayQuestion();
        return;
      }
      const item = PART1[idx];
      updateProgress(idx + 2);
      captionBox.textContent = item.caption;
      crossfadeTo(IMAGES[item.key], item.key);
      idx += 1;
      later(nextScene, item.duration);
    }
    nextScene();
  }

  function showHalayQuestion() {
    captionBox.classList.add('hidden');
    updateProgress(12);
    crossfadeTo(IMAGES.halay_question, 'Eren seni halaya davet ediyor');
    later(() => {
      acceptHalayHotspot.classList.remove('hidden');
      declineHalayHotspot.classList.remove('hidden');
    }, 480);
  }

  function runAcceptHalayPath() {
    clearTimers();
    hideAllOverlays();
    let idx = 0;
    function nextScene() {
      if (idx >= PART2.length) {
        showFinalQuestion();
        return;
      }
      const item = PART2[idx];
      updateProgress(13 + idx);
      crossfadeTo(IMAGES[item.key], item.key);
      if (item.caption) {
        captionBox.classList.remove('hidden');
        captionBox.textContent = item.caption;
      } else {
        captionBox.classList.add('hidden');
      }
      idx += 1;
      later(nextScene, item.duration);
    }
    nextScene();
  }

  function showFinalQuestion() {
    hideAllOverlays();
    captionBox.classList.add('hidden');
    updateProgress(17);
    crossfadeTo(IMAGES.final_question, 'Şimdi ne yapalım? Yanına git ve ismini sor / Boşver be');
    later(() => {
      askNameHotspot.classList.remove('hidden');
      ignoreHotspot.classList.remove('hidden');
    }, 450);
  }

  function showEnding(title, copy, progressText=null) {
    hideAllOverlays();
    captionBox.classList.add('hidden');
    endingTitle.textContent = title;
    endingCopy.textContent = copy;
    endingPanel.classList.remove('hidden');
    if (progressText) {
      progressPill.textContent = progressText;
    }
  }

  function noFirstChoice() {
    clearTimers();
    showEnding('Bu alternatif yol henüz yazılmadı.','Şimdilik sadece “Evet, yandaki çocuğa bak” yolunu güncelledim. İstersen bu dalı da sonra ekleyebiliriz.','Yan Dal');
  }

  function declineHalay() {
    clearTimers();
    showEnding('Beyza daveti kabul etmedi.','Bu alternatif kararın devamını da istersek ayrı bir yol olarak yazabiliriz.','Karar Verildi');
  }

  function askNamePath() {
    clearTimers();
    hideAllOverlays();
    updateProgress(18);
    captionBox.classList.add('hidden');
    crossfadeTo(IMAGES.intro_name_age,'Eren kendini tanıtıyor; Beyza da adını söyleyip kaç yaşında olduğunu soruyor');
    later(() => {
      updateProgress(19);
      crossfadeTo(IMAGES.age_reveal,'Eren 25 yaşında olduğunu söylüyor; Beyza Ben de 28 diyor');
      later(() => {
        showAgeDifferenceQuestion();
      }, 3600);
    }, 3600);
  }

  function showAgeDifferenceQuestion() {
    clearTimers();
    hideAllOverlays();
    captionBox.classList.add('hidden');
    updateProgress(20);
    crossfadeTo(IMAGES.age_difference_question,'Bu farkı problem etmeli misin? Hayır ben ondan hoşlandım / Olmaz yaşıt değiliz');
    later(() => {
      ageOkHotspot.classList.remove('hidden');
      ageNoHotspot.classList.remove('hidden');
    }, 500);
  }

  function chooseAgeOk() {
    clearTimers();
    showEnding('Beyza yaş farkını problem etmedi.','“Hayır, ben ondan hoşlandım.” yolu seçildi. Hikâyenin devamını buradan kuracağız.','Karar Verildi');
  }

  function chooseAgeNo() {
    clearTimers();
    showEnding('Beyza yaş farkını problem etti.','“Olmaz, yaşıt değiliz.” yolu seçildi. Bu alternatif yolu daha sonra ayrı şekilde devam ettireceğiz.','Karar Verildi');
  }

  function ignorePath() {
    clearTimers();
    showEnding('Beyza geri durdu.','Bir sonraki adımda “Boşver be” yolunu ayrı bir akış olarak yazabiliriz.');
  }

  function restart() {
    clearTimers();
    storyView.classList.remove('active');
    menuView.classList.add('active');
    hideAllOverlays();
    captionBox.classList.remove('hidden');
    captionBox.textContent = 'Eren ve Beyza yan yana, birbirlerinden habersiz şekilde dans ediyor…';
    updateProgress(1);
  }

  document.getElementById('newGame').addEventListener('click', startGame);
  document.getElementById('continueBtn').addEventListener('click', () => showHint('Henüz kayıtlı oyun yok.'));
  document.getElementById('chaptersBtn').addEventListener('click', () => showHint('Bölümler ilerledikçe açılacak.'));
  document.getElementById('memoriesBtn').addEventListener('click', () => showHint('Anılar ilerledikçe açılacak.'));
  document.getElementById('yesBtn').addEventListener('click', runPart1);
  document.getElementById('noBtn').addEventListener('click', noFirstChoice);
  acceptHalayHotspot.addEventListener('click', runAcceptHalayPath);
  declineHalayHotspot.addEventListener('click', declineHalay);
  askNameHotspot.addEventListener('click', askNamePath);
  ignoreHotspot.addEventListener('click', ignorePath);
  ageOkHotspot.addEventListener('click', chooseAgeOk);
  ageNoHotspot.addEventListener('click', chooseAgeNo);
  document.getElementById('restartBtn').addEventListener('click', restart);
})();
</script>
</body>
</html>
