<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEYZA</title>
<style>html,body{margin:0;background:#07050b;color:#fff;font-family:system-ui}#loading{min-height:100vh;display:grid;place-items:center}</style>
</head>
<body>
<div id="loading">Yükleniyor…</div>
<script>
(async()=>{
  const files = Array.from({length:13},(_,i)=>'chunks/'+String(i).padStart(2,'0')+'.txt');
  try{
    const parts = await Promise.all(files.map(f=>fetch(f+'?v=1').then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    const full = parts.join('');
    document.open();
    document.write(full);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Oyun dosyaları yüklenemedi.';
    console.error(e);
  }
})();
</script>
</body>
</html>
