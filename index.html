<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEYZA</title>
<style>html,body{margin:0;background:#07050b;color:#fff;font-family:system-ui;height:100%}#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.sub{opacity:.65;font-size:13px;margin-top:8px}</style></head>
<body><div id="loading"><div><b>BEYZA</b><div class="sub">Hikâye yükleniyor…</div></div></div>
<script src="assets/00.js"></script><script src="assets/01.js"></script><script src="assets/02_06.js"></script>
<script src="bundles/00.js"></script>
<script>
(()=>{try{
 const a=window.__BEYZA_ASSETS__||[];
 if(!a.length) throw new Error("asset bundle");
 const loader=document.getElementById("loading");
 loader.innerHTML='<div><b>BEYZA</b><div class="sub">Sahne dosyaları hazırlanıyor…</div></div>';
 window.dispatchEvent(new Event("beyza-assets-ready"));
 setTimeout(()=>{if(document.getElementById("loading")) loader.innerHTML='<div><b>BEYZA</b><div class="sub">Oyun paketi eksik. Dağıtım onarımı sürüyor.</div></div>'},4000);
}catch(e){document.getElementById("loading").textContent="Oyun yüklenemedi.";console.error(e)}})();
</script></body></html>
